<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GLAMLI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee;
    --bg-elev: #fbf9f4;
    --surface: #ffffff;
    --surface-2: #f1ede5;
    --border: #e6e0d4;
    --border-strong: #d8d0bf;
    --text: #2a2825;
    --text-2: #6b6760;
    --text-3: #9a9388;
    --accent: #6f8a6a;        /* sage */
    --accent-soft: #e3ebde;
    --accent-ink: #43583f;
    --warn: #b8763a;
    --danger: #b65a4f;
    --good: #6f8a6a;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 0 rgba(40,30,15,.04), 0 1px 2px rgba(40,30,15,.04);
    --shadow-md: 0 1px 0 rgba(40,30,15,.04), 0 4px 14px rgba(40,30,15,.06);
    --pad: 20px;
    --gap: 16px;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-serif: 'Source Serif 4', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: #1a1916;
    --bg-elev: #211f1b;
    --surface: #26241f;
    --surface-2: #2e2b25;
    --border: #36322b;
    --border-strong: #44403a;
    --text: #ebe7df;
    --text-2: #a8a297;
    --text-3: #75716a;
    --accent-soft: #2d3a2a;
    --accent-ink: #b6c8b1;
  }
  [data-density="compact"] {
    --pad: 14px;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100vh; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-weight: 500;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary {
    background: var(--accent);
    color: #fbf9f4;
    border-color: transparent;
  }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-2);
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { height: 26px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; }
  .btn-icon {
    width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---- Panels ---- */
  .panel {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-width: 0;
    height: 100%;
  }
  .panel:last-child { border-right: none; }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-3);
    font-weight: 600;
  }
  .panel-body {
    flex: 1; min-height: 0; overflow: auto;
  }

  /* ---- Layout ---- */
  .app-shell {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100%;
  }
  @media (max-width: 1280px) {
    .app-shell { grid-template-columns: 280px 1fr; }
  }
  .view-toggle {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    border: none; background: transparent;
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .view-toggle button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .view-toggle button:hover:not(.active) { color: var(--text); }
  .view-header {
    height: 48px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    position: relative;
  }
  .view-header-meta {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--text-3);
  }

  /* ---- Topbar ---- */
  .topbar {
    height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: -.01em;
  }
  .brand-mark {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fbf9f4;
    font-size: 11px; font-weight: 700;
    font-family: var(--font-serif);
  }
  .topbar-meta { font-size: 12.5px; color: var(--text-2); display: flex; gap: 14px; align-items: center; }

  /* ---- Chat ---- */
  .chat-feed { padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
  .msg-meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 13.5px;
  }
  .msg-bubble p { margin: 0 0 8px; }
  .msg-bubble p:last-child { margin: 0; }
  .msg-bubble strong { color: var(--text); font-weight: 600; }
  .msg-bubble code, .msg-bubble .ref {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-ink);
  }
  .msg.user .msg-bubble {
    background: transparent;
    border-color: transparent;
    padding: 0;
    color: var(--text-2);
    font-style: italic;
  }
  .msg.user .msg-meta { color: var(--text-3); }
  .typing-dot {
    display: inline-block; width: 5px; height: 5px;
    background: var(--text-3); border-radius: 50%;
    margin-right: 3px;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  .composer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .composer-box {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px 10px 8px 12px;
    transition: border-color .15s;
  }
  .composer-box:focus-within { border-color: var(--accent); }
  .composer textarea {
    width: 100%; min-height: 40px; max-height: 140px;
    border: none; outline: none; resize: none;
    background: transparent;
    font-size: 13.5px; line-height: 1.5;
  }
  .composer-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px;
  }
  .composer-tools { display: flex; gap: 4px; }

  /* ---- Workflow stages ---- */
  .workflow-body { padding: 28px 36px 60px; max-width: 760px; margin: 0 auto; }
  .workflow-rail {
    display: flex; gap: 4px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .rail-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-2);
    background: transparent;
    border: 1px solid transparent;
    white-space: nowrap;
    cursor: pointer;
  }
  .rail-item:hover:not(:disabled) { background: var(--surface-2); }
  .rail-item:disabled { opacity: .45; cursor: not-allowed; }
  .rail-item.active { background: var(--surface); border-color: var(--border); color: var(--text); font-weight: 500; }
  .rail-item.complete .rail-num { background: var(--accent); color: #fbf9f4; border-color: transparent; }
  .rail-num {
    width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    font-size: 11px; font-weight: 600;
    color: var(--text-2);
  }
  .rail-item.active .rail-num {
    background: var(--text);
    color: var(--bg-elev);
    border-color: transparent;
  }

  .stage-eyebrow {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-3);
    font-weight: 600;
  }
  h1.stage-title {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 32px;
    line-height: 1.15;
    letter-spacing: -.015em;
    margin: 6px 0 6px;
    color: var(--text);
  }
  .stage-lede {
    color: var(--text-2);
    font-size: 15px;
    margin: 0 0 24px;
    max-width: 60ch;
    text-wrap: pretty;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .card-pad { padding: 18px 20px; }
  .card-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-row:last-child { border-bottom: none; }

  /* ---- Drop zone ---- */
  .dropzone {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    background: var(--surface);
    padding: 40px;
    text-align: center;
    transition: background .15s, border-color .15s;
    cursor: pointer;
  }
  .dropzone:hover { background: var(--bg-elev); border-color: var(--accent); }
  .dropzone.uploaded { border-style: solid; cursor: default; padding: 18px 22px; text-align: left; }

  /* ---- Table ---- */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  table.preview { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.preview th, table.preview td {
    text-align: left; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.preview th {
    font-weight: 600; color: var(--text-2);
    background: var(--bg-elev);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
  }
  table.preview tbody tr:last-child td { border-bottom: none; }
  table.preview tbody tr:hover { background: var(--bg-elev); }

  /* ---- Column assumptions ---- */
  .col-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .col-name {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 2px 8px; border-radius: 5px;
    display: inline-block;
  }
  .col-type { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .assumption {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0;
    border-top: 1px dashed var(--border);
    color: var(--text);
    font-size: 13px;
  }
  .assumption:first-of-type { border-top: none; }
  .assumption .a-bullet { color: var(--text-3); flex-shrink: 0; line-height: 1.6; }
  .assumption .a-text { flex: 1; line-height: 1.55; }
  .assumption-edit { width: 100%; background: transparent; border: none; outline: none; resize: none; font-size: 13px; line-height: 1.55; padding: 0; }
  .assumption-actions { opacity: 0; display: flex; gap: 2px; transition: opacity .15s; }
  .assumption:hover .assumption-actions { opacity: 1; }

  /* ---- Spec fields ---- */
  .spec-field {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .spec-field:last-child { border-bottom: none; }
  .spec-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 600; margin-bottom: 4px; }
  .spec-value {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 8px; margin: -6px -8px;
    width: calc(100% + 16px);
    font-size: 13.5px; color: var(--text);
    line-height: 1.5;
    resize: none;
  }
  .spec-value:hover { border-color: var(--border); background: var(--bg-elev); }
  .spec-value:focus { outline: none; border-color: var(--accent); background: var(--surface); }

  /* ---- Progress ---- */
  .progress-track { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .4s ease; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 14px;
    border: none; background: transparent;
    color: var(--text-2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-size: 13px;
    font-weight: 500;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  /* ---- Pill / badge ---- */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11.5px; font-weight: 500;
    background: var(--surface-2);
    color: var(--text-2);
  }
  .pill.good { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.warn { background: rgba(184, 118, 58, .14); color: var(--warn); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- RelationshipStrip (multi-CSV) ---- */
  .rel-strip {
    background: var(--accent-soft);
    color: var(--accent-ink);
    padding: 10px 14px;
    border-radius: var(--radius);
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .rel-strip.refused { background: rgba(184,118,58,.14); color: var(--warn); }
  .rel-strip-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .rel-strip-info { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rel-strip .mono { color: inherit; }
  .rel-strip-warn {
    margin-top: 6px; font-size: 12px;
    color: var(--warn);
    background: rgba(184,118,58,.10);
    padding: 4px 8px; border-radius: 6px;
  }
  .rel-strip-link {
    background: transparent; border: none;
    color: var(--accent-ink); font: inherit; font-weight: 500;
    cursor: pointer; padding: 2px 4px; border-radius: 4px;
    text-decoration: underline; text-underline-offset: 2px;
    text-decoration-thickness: 1px;
  }
  .rel-strip-link:hover { background: rgba(255,255,255,.4); }
  .rel-strip.refused .rel-strip-link { color: var(--warn); }

  /* Key picker (inside RelationshipStrip) */
  .key-picker {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(67, 88, 63, .35);
    display: flex; flex-direction: column; gap: 8px;
  }
  .key-picker-row {
    display: grid; grid-template-columns: 1fr auto 1fr auto;
    gap: 8px; align-items: center;
  }
  .key-picker-row select {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 4px 6px; font-size: 12.5px;
    color: var(--text);
  }
  .key-picker-row .arrow { color: var(--accent-ink); }
  .key-picker-actions { display: flex; justify-content: space-between; align-items: center; }

  /* ---- FileCard (multi-CSV) ---- */
  .filecard { margin-bottom: 18px; }
  .filecard.refused { opacity: .72; }
  .filecard-iconpad {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .filecard.refused .filecard-iconpad {
    background: rgba(184,118,58,.14); color: var(--warn);
  }
  .filecard-meta { font-weight: 500; }
  .filecard-meta-sub { font-size: 12px; color: var(--text-2); }

  .filecard-classifying-bar {
    height: 4px; background: var(--surface-2);
    border-radius: 2px; overflow: hidden; margin-top: 6px;
  }
  .filecard-classifying-bar > div {
    height: 100%; width: 35%;
    background: linear-gradient(90deg, transparent, var(--accent-ink), transparent);
    animation: filecard-classify 1.2s linear infinite;
  }
  @keyframes filecard-classify {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(285%); }
  }

  /* Subordinate dropzone — re-uses .dropzone.uploaded chrome but is
   * clickable, and stays a single-line invitation. */
  .dropzone.subordinate {
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .dropzone.subordinate:hover { background: var(--bg-elev); border-color: var(--accent); }
  .dropzone.subordinate .sub-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--surface-2); color: var(--text-3);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dropzone.subordinate .sub-text { font-size: 13.5px; font-weight: 500; }
  .dropzone.subordinate .sub-hint { font-size: 12px; color: var(--text-2); }

  /* Refusal explanation card */
  .refusal-explain { margin-top: -6px; margin-bottom: 18px; }
  .refusal-explain p { margin: 0 0 10px; line-height: 1.55; }
  .refusal-explain ul {
    list-style: none; padding: 0; margin: 4px 0 0;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .refusal-explain ul li {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--surface-2); color: var(--text-2);
    padding: 2px 8px; border-radius: 5px;
  }
  .refusal-explain summary {
    cursor: pointer; color: var(--text-2); font-size: 12.5px;
    padding: 4px 0; user-select: none;
  }
  .refusal-explain summary:hover { color: var(--text); }
  .refusal-explain[open] summary { margin-bottom: 6px; }
  .refusal-explain-cols { display: flex; gap: 24px; flex-wrap: wrap; }
  .refusal-explain-cols > div { min-width: 180px; }
  .refusal-explain-cols .col-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-3); font-weight: 600; margin-bottom: 4px;
  }

  /* ---- Domain page (multi-CSV additions) ---- */
  .sources-card { margin-bottom: 24px; }
  .sources-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: transparent; border: none; cursor: pointer;
    padding: 14px 18px; font: inherit; color: var(--text);
    text-align: left;
  }
  .sources-toggle:hover { background: var(--bg-elev); }
  .sources-toggle-title { font-weight: 600; font-size: 13.5px; }
  .sources-toggle-meta { font-size: 12px; color: var(--text-2); }
  .sources-toggle .chev { transition: transform .15s; color: var(--text-3); }
  .sources-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .sources-body {
    border-top: 1px solid var(--border);
    padding: 14px 18px;
    display: flex; flex-direction: column;
  }

  /* Per-source group headers on Domain */
  .source-group { margin-bottom: 16px; }
  .source-group-head {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3); font-weight: 600;
    margin: 18px 0 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .source-group-head:first-child { margin-top: 0; }
  .source-group-head .mono { color: var(--accent-ink); }
  .source-group-head .count { color: var(--text-3); font-weight: 500; }

  /* "join key" / "shared across sources" cue pills inside col-card */
  .col-card .role-pill {
    margin-left: 8px;
    font-size: 10.5px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent-ink);
    padding: 2px 6px; border-radius: 5px;
    text-transform: none; letter-spacing: 0;
  }

  /* Validation strip — sticky bottom */
  .validation-strip {
    position: sticky; bottom: 0;
    margin: 24px -36px 0;
    padding: 12px 36px;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px;
    z-index: 2;
  }
  .validation-strip.warn { background: rgba(184,118,58,.14); color: var(--warn); border-top-color: rgba(184,118,58,.3); }
  .validation-strip .v-inline { display: inline-flex; align-items: center; gap: 8px; }
  .validation-strip .v-link {
    background: transparent; border: none; padding: 2px 4px;
    font: inherit; color: inherit; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .validation-strip .v-link:hover { background: rgba(255,255,255,.3); }

  /* ---- Skeleton ---- */
  .skel { background: linear-gradient(90deg, var(--surface-2), var(--bg-elev), var(--surface-2)); background-size: 200% 100%; animation: skel 1.6s linear infinite; border-radius: 5px; }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ---- Flowchart panel ---- */
  .flow-canvas {
    flex: 1;
    position: relative;
    background:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    overflow: hidden;
  }
  .flow-svg { position: absolute; inset: 0; pointer-events: none; }
  .node {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 10px 12px;
    width: 152px;
    box-shadow: var(--shadow-sm);
    font-size: 12px;
    cursor: grab;
    user-select: none;
  }
  .node:active { cursor: grabbing; }
  .node-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .node-name { font-family: var(--font-mono); color: var(--accent-ink); font-size: 11.5px; font-weight: 500; }
  .node-value { font-size: 13px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .node-input input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 12.5px;
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  .node-input input:focus { border-color: var(--accent); }
  .node.model {
    width: 168px;
    background: var(--surface);
    text-align: center;
    border: 1.5px solid var(--border-strong);
  }
  .node.model.lit {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .node.model.lit .node-name { color: var(--accent-ink); }
  .node.output { background: var(--bg-elev); }
  .node.output.predicted { background: var(--accent-soft); border-color: var(--accent); }
  .node-handle {
    position: absolute;
    width: 8px; height: 8px;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    top: 50%; transform: translateY(-50%);
  }
  .node-handle.left { left: -5px; }
  .node-handle.right { right: -5px; }

  .case-tabs {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 4px; overflow-x: auto;
    background: var(--bg-elev);
  }
  .case-tab {
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 7px;
    font-size: 12px;
    color: var(--text-2);
    white-space: nowrap;
  }
  .case-tab.active { background: var(--text); color: var(--bg-elev); border-color: transparent; }
  .case-tab.add { border-style: dashed; color: var(--text-3); background: transparent; }

  /* ---- Loading screen ---- */
  .loading-stage { text-align: center; padding: 40px 20px; }
  .loader {
    width: 56px; height: 56px;
    margin: 0 auto 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-line {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 6px;
  }
  .status-line.done { color: var(--text); }
  .status-line.active { background: var(--accent-soft); color: var(--accent-ink); }
  .status-icon { width: 16px; flex-shrink: 0; }

  /* ---- Plan rows ---- */
  .plan-row {
    display: grid;
    grid-template-columns: 24px 1fr auto auto;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    align-items: center;
  }
  .plan-row:last-child { border-bottom: none; }
  .plan-row.best { background: var(--accent-soft); }
  .plan-name { font-family: var(--font-mono); font-size: 12.5px; }
  .plan-score { font-variant-numeric: tabular-nums; font-weight: 500; }

  /* utility */
  .row { display: flex; gap: 8px; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .grow { flex: 1; }
  .muted { color: var(--text-2); }
  .small { font-size: 12px; }
  .mono { font-family: var(--font-mono); }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .kbd {
    display: inline-block; font-family: var(--font-mono);
    font-size: 11px; padding: 1px 5px;
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 4px;
    color: var(--text-2);
    background: var(--surface);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg-elev); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
</style>
</head>
